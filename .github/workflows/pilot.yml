name: Phase 1 Manhattan pilot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Run Manhattan linkage pilot
        run: python scripts/run_match_pilot.py

      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-pilot-results
          path: data/processed/pilot/
